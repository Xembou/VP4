# =====================================================================
#  Baut VP4.exe automatisch und hängt sie an ein GitHub-Release
# =====================================================================
#
#     git tag v5.0.0
#     git push origin v5.0.0
#
# GitHub baut daraufhin auf einem eigenen Windows-Rechner, lässt den
# Selbsttest laufen und legt ein Release mit der fertigen VP4.exe an.
# Wer VP4 haben will, lädt sie einfach unter "Releases" herunter.
#
# DER EINGEBAUTE DISCORD-ZUGANG
# ------------------------------
# Leon hat am 01.10.2026 entschieden: Die öffentliche .exe enthält den
# Bot-Token, damit jeder sofort chatten kann. Dafür im Repo unter
# Settings > Secrets and variables > Actions anlegen:
#     DISCORD_BOT_TOKEN    der Token des Bots
#     DISCORD_KANAL_IDS    eine oder mehrere Kanal-IDs, mit Komma getrennt
# Was das bedeutet (der Token ist aus der .exe herauszuholen, die
# Nachrichten bleiben trotzdem Ende-zu-Ende verschlüsselt) und was man
# tut, wenn Discord den Token sperrt, steht in der README.
# Ohne die Secrets baut alles genauso - nur ohne eingebauten Zugang.
# =====================================================================

name: VP4.exe bauen und veröffentlichen

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write        # nötig, um das Release anlegen zu dürfen

jobs:
  bauen:
    runs-on: windows-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Selbsttest
        env:
          VP4_TEST_OHNE_GUI: "1"     # auf GitHubs Rechnern gibt es keinen Bildschirm
        run: python test_vp4.py

      # Erst NACH dem Selbsttest, damit der Token nirgends in einer
      # Testausgabe auftauchen kann.
      - name: Discord-Zugang einsetzen
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          KANAL_IDS: ${{ secrets.DISCORD_KANAL_IDS }}
        run: |
          if ($env:BOT_TOKEN -and $env:KANAL_IDS) {
            $datei = "discord_konfig.py"
            $inhalt = Get-Content $datei -Raw -Encoding UTF8
            $inhalt = $inhalt -replace 'BOT_TOKEN = ""', "BOT_TOKEN = `"$env:BOT_TOKEN`""
            $inhalt = $inhalt -replace 'KANAL_IDS = ""', "KANAL_IDS = `"$env:KANAL_IDS`""
            Set-Content $datei $inhalt -Encoding UTF8 -NoNewline
            Write-Output "Discord-Zugang eingesetzt."
          } else {
            Write-Output "Keine Discord-Secrets hinterlegt - die .exe wird ohne"
            Write-Output "eingebauten Zugang gebaut (Chat dann nur im WLAN oder"
            Write-Output "mit eigenem Bot unter Einstellungen > Discord)."
          }

      - name: Icon erzeugen
        run: python icon_erzeugen.py

      # Derselbe Befehl wie lokal (bauen.py) - eine zweite, abweichende
      # Liste von PyInstaller-Schaltern hier wäre ein Fehler, der nur beim
      # Veröffentlichen auffällt. Den Probelauf macht pruefen.yml OHNE
      # Token; eine .exe mit eingebautem Zugang soll in der CI nicht starten.
      - name: VP4.exe bauen
        run: python bauen.py --ohne-test --ohne-probelauf

      - name: Nachsehen, ob die .exe entstanden ist
        run: |
          if (-not (Test-Path dist/VP4.exe)) { throw "dist/VP4.exe fehlt" }
          $mb = [math]::Round((Get-Item dist/VP4.exe).Length / 1MB, 1)
          Write-Output "VP4.exe gebaut: $mb MB"

      - name: Auch ohne Release zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VP4-exe
          path: dist/VP4.exe

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VP4.exe
          generate_release_notes: true
          body: |
            ## Herunterladen

            **`VP4.exe`** unten anklicken, herunterladen, doppelklicken.
            Du brauchst kein Python und musst nichts installieren.

            Windows zeigt beim ersten Start eine Warnung, weil das Programm
            nicht kostenpflichtig signiert ist:
            **Weitere Informationen** → **Trotzdem ausführen**.

            Beim ersten Start legst du ein Master-Passwort fest. Schreib es
            dir auf – es lässt sich nicht wiederherstellen.
