<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strenge Regeln, was die Seite laden und ausführen darf. Hinter der
       Oberfläche hängt Python mit allen Schlüsseln - ein eingeschleustes
       Skript in einer Chatnachricht darf hier nichts ausrichten können.
       Deshalb: kein Inline-Skript, nichts von fremden Servern. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://127.0.0.1:*; media-src 'self' blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>VP4</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/komponenten.css">
  <link rel="stylesheet" href="css/rahmen.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/seiten.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="tapete" aria-hidden="true"></div>

  <!-- Lichtbrechung für "Glas stark" (nur Chromium) -->
  <svg width="0" height="0" class="nur-vorlesen" aria-hidden="true">
    <filter id="fluessigglas" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="rauschen"/>
      <feGaussianBlur in="rauschen" stdDeviation="2" result="weich"/>
      <feDisplacementMap in="SourceGraphic" in2="weich" scale="-24" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <div id="app" class="versteckt"></div>
  <div id="vollbild"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
